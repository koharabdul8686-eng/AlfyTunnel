name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: unzip -o AlfyTunnel.zip -d AlfyTunnel

      - name: Build debug APK
        working-directory: AlfyTunnel
        run: |
          [ -f gradle/wrapper/gradle-wrapper.jar ] || gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Tentukan tag
        id: ver
        working-directory: AlfyTunnel
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v${VN}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AlfyTunnel ${{ steps.ver.outputs.tag }}
          files: AlfyTunnel/app/build/outputs/apk/debug/app-debug.apk
